<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title description">
  <title id="title">소년 상태 다이어그램</title>
  <desc id="description">Idle, Run, Sleep, AutoRun 상태와 키 입력 및 시간에 따른 전이를 나타낸다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .state { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .auto { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .label { font: 600 18px sans-serif; fill: #0f172a; text-anchor: middle; }
      .transition { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .event { font: 15px sans-serif; fill: #334155; }
    </style>
  </defs>

  <ellipse cx="92" cy="285" rx="38" ry="26" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text class="label" x="92" y="291">시작</text>

  <rect class="state" x="205" y="250" width="150" height="70" rx="18"/>
  <text class="label" x="280" y="292">IDLE</text>
  <rect class="state" x="490" y="90" width="150" height="70" rx="18"/>
  <text class="label" x="565" y="132">RUN</text>
  <rect class="state" x="490" y="410" width="150" height="70" rx="18"/>
  <text class="label" x="565" y="452">SLEEP</text>
  <rect class="auto" x="770" y="250" width="180" height="70" rx="18"/>
  <text class="label" x="860" y="292">AUTO_RUN</text>

  <path class="transition" d="M 130 285 L 202 285"/>
  <path class="transition" d="M 355 260 C 410 220 435 160 487 132"/>
  <text class="event" x="385" y="195">방향키 누름</text>
  <path class="transition" d="M 490 108 C 430 35 360 35 315 247"/>
  <text class="event" x="365" y="57">방향키 뗌</text>
  <path class="transition" d="M 280 322 C 280 370 400 430 487 440"/>
  <text class="event" x="310" y="390">5초 경과</text>
  <path class="transition" d="M 490 460 C 405 520 310 520 280 323"/>
  <text class="event" x="357" y="510">Space</text>
  <path class="transition" d="M 565 408 L 565 163"/>
  <text class="event" x="580" y="290">방향키 누름</text>
  <path class="transition" d="M 355 275 C 480 220 645 220 767 275"/>
  <text class="event" x="560" y="218">a 누름</text>
  <path class="transition" d="M 770 260 C 720 190 680 135 643 125"/>
  <text class="event" x="675" y="190">방향키 누름</text>
  <path class="transition" d="M 770 290 C 650 350 470 350 355 295"/>
  <text class="event" x="560" y="345">5초 경과</text>
</svg>
